services:
  rkllm-server:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: ${RKLLM_IMAGE:-rkllm-server:arm64}
    platform: linux/arm64
    privileged: true
    ports:
      - "8080:8080"
    devices:
      - /dev:/dev
    environment:
      TARGET_PLATFORM: ${TARGET_PLATFORM:-rk3588}
      RKLLM_MODEL_PATH: ${RKLLM_MODEL_PATH:-qwen3/qwen3.rkllm}
    volumes:
      - ./models:/models:ro
      - /sys:/sys
    command:
      - --target_platform
      - ${TARGET_PLATFORM:-rk3588}
      - --rkllm_model_path
      - /models/${RKLLM_MODEL_PATH:-qwen3/qwen3.rkllm}
    restart: unless-stopped

