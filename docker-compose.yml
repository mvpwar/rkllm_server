services:
  rkllm-server:
    image: ghcr.io/mvpwar/rkllm_server:latest
    platform: linux/arm64
    privileged: true
    ports:
      - "8080:8080"
    devices:
      - /dev:/dev
    volumes:
      - /vol1/1000/rkllama/models:/models:ro
    command:
      - --target_platform
      - rk3588
      - --rkllm_model_path
      - /models/Qwen2.5-1.5B-Instruct/Qwen2.5-1.5B-Instruct-rk3588-w8a8-opt-0-hybrid-ratio-1.0.rkllm
    restart: unless-stopped